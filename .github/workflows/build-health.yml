name: Build health

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Validate composer manifest
        run: composer validate --no-check-publish

      - name: PHP syntax check
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
